name: Build PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }} # Test merge includes current default-branch tooling.
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r .github/requirements-site.txt
      - name: Test publishing logic
        run: python -m unittest discover -s .github/tests -v
      - name: Build with preview base path
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python .github/scripts/build_site.py --pr "$PR_NUMBER" --output site
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-preview-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: site/
          retention-days: 2
          if-no-files-found: error
          compression-level: 1
