name: Publish Site Work Flow

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r .github/requirements-site.txt
      - run: python -m unittest discover -s .github/tests -v
      - run: python .github/scripts/build_site.py --output site
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-site
          path: site/
          retention-days: 2
          if-no-files-found: error
          compression-level: 1
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    steps:
      # Only reviewed default-branch scripts run in this job. Never build here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-site
          path: ${{ runner.temp }}/site
      - name: Publish without overwriting PR previews
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_DIR: ${{ runner.temp }}/site
        run: python .github/scripts/publish_site.py production
